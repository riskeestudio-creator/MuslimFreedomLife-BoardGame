<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1b2a">
</head>
<body>
<title>Muslim Freedom Life Board Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>/* ทิศทางภาพ: ท้องฟ้าตามเวลาละหมาด กลางวันคือดุฮา กลางคืนคือลัยล์ ตัวละครเหลี่ยมมุมไม่มีใบหน้า บนโต๊ะลายเซลลีจ
   ผัง: หน้าจอเดียวไม่เลื่อน กระดานซ้าย แผงตัดสินใจขวา มือถือแนวตั้งเรียงบนลงล่าง */
:root{
 --bg:#DDEEF0;--surface:#FFFFFF;--surface2:#EEF5F4;--ink:#10253A;--ink2:#4C6072;--line:#CBDcDD;
 --accent:#0E7C66;--accent-ink:#FFFFFF;--gold:#E9A11C;--lapis:#2B4FA6;--coral:#D9472F;--rose:#D6417F;
 --table:#BFE0DF;--innerplate:#F2FBF7;--innerink:#0F3A44;--innerlabel:#8FE3CF;--plate:#0F4D56;--plate2:#0A3942;--hubbg:#E9F5F2;--hubink:#0F3A44;
 --sky1:#7EC4E0;--sky2:#BCE6E2;--sky3:#FFE3B0;--sun1:#FFD77A;--sun2:#FFF0BE;--stars:0;
 --m1:#7FB8B4;--m1b:#6CA8A6;--m2:#F4EFE2;--m2b:#DCD6C4;--m3:#2E9C84;--m3b:#237F6D;--m4:#16604F;
 --shadow:0 10px 26px rgba(16,37,58,.14);
 --f:'Readex Pro','Anuphan',system-ui,sans-serif;--fw:'Readex Pro',system-ui,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0B1A2B;--surface:#132840;--surface2:#1A334F;--ink:#EEF4F5;--ink2:#A3B6C5;--line:#284562;
 --accent:#2CC2A1;--accent-ink:#06231E;--gold:#F6BE4F;--lapis:#7D9FEF;--coral:#F27A62;--rose:#F07BAE;
 --table:#0E2236;--innerplate:#1B3F57;--innerink:#EEF4F5;--innerlabel:#8FE3CF;--plate:#06222F;--plate2:#04161F;--hubbg:#132840;--hubink:#EEF4F5;
 --sky1:#071326;--sky2:#14305C;--sky3:#3C4A86;--sun1:rgba(246,214,130,.16);--sun2:#F3E3B3;--stars:1;
 --m1:#14305A;--m1b:#102749;--m2:#22426F;--m2b:#1A3559;--m3:#0F4A4F;--m3b:#0B3A40;--m4:#072A30;
 --shadow:0 12px 30px rgba(0,0,0,.42);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0B1A2B;--surface:#132840;--surface2:#1A334F;--ink:#EEF4F5;--ink2:#A3B6C5;--line:#284562;
 --accent:#2CC2A1;--accent-ink:#06231E;--gold:#F6BE4F;--lapis:#7D9FEF;--coral:#F27A62;--rose:#F07BAE;
 --table:#0E2236;--innerplate:#1B3F57;--innerink:#EEF4F5;--innerlabel:#8FE3CF;--plate:#06222F;--plate2:#04161F;--hubbg:#132840;--hubink:#EEF4F5;
 --sky1:#071326;--sky2:#14305C;--sky3:#3C4A86;--sun1:rgba(246,214,130,.16);--sun2:#F3E3B3;--stars:1;
 --m1:#14305A;--m1b:#102749;--m2:#22426F;--m2b:#1A3559;--m3:#0F4A4F;--m3b:#0B3A40;--m4:#072A30;
 --shadow:0 12px 30px rgba(0,0,0,.42);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{height:100%;position:relative}
.scr{height:100%;width:100%;position:relative;overflow:hidden}
.grow{flex:1}
.uic{width:1.25em;height:1.25em;flex:none}
.ico{width:100%;height:100%}
.sc-stars{opacity:var(--stars)}
.scene{position:absolute;inset:0;width:100%;height:100%}

/* ประตูเข้าเกม */
.gate{cursor:pointer;display:grid;place-items:center;padding:12px max(16px,env(safe-area-inset-left,0px))}
.gate-in{position:relative;display:grid;justify-items:center;gap:clamp(6px,1.6vh,14px);text-align:center;animation:rise .9s cubic-bezier(.2,.9,.25,1) both}
.gate-logo{width:clamp(96px,26vmin,190px);display:block}
.emblem{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 16px rgba(5,20,40,.3))}
.gate-w{color:#fff;text-shadow:0 2px 12px rgba(5,20,40,.5);font-family:var(--fw)}
.gate-w b{display:block;font-size:clamp(22px,5.4vmin,44px);font-weight:700;letter-spacing:-.01em}
.gate-w i{font-style:normal;font-size:clamp(11px,2.2vmin,15px);letter-spacing:.42em;opacity:.92}
.enter{display:inline-flex;gap:10px;align-items:center;background:#FFD77A;color:#10253A;padding:12px 26px;border-radius:999px;font-weight:700;font-size:clamp(15px,3vmin,19px);box-shadow:0 8px 24px rgba(5,20,40,.35);animation:pulse 2.2s ease-in-out infinite}
.gate small{color:#fff;display:inline-flex;gap:6px;align-items:center;font-size:12px;text-shadow:0 1px 6px rgba(5,20,40,.6)}
.logo-sun{transform-origin:100px 84px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes pulse{50%{transform:scale(1.04)}}

/* หน้าหลัก */
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
html[dir="rtl"] .home-stage{order:2}
.home-stage{position:relative;overflow:hidden;min-height:0}
.guide{position:absolute;inset-inline-start:0;bottom:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.guide-fig{height:82%;display:block;animation:enterIn .8s cubic-bezier(.2,1.3,.4,1) both;transform-origin:bottom}
.guide-fig .fig{height:100%;width:auto;display:block;overflow:visible}
.guide.talk{justify-content:flex-start}
.guide.talk .guide-fig{margin-inline-start:2%}
@keyframes enterIn{from{opacity:0;transform:translateY(40px) scale(.94)}}
.wave-arm{transform-origin:152px 118px;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,62%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}78%{transform:rotate(3deg)}86%{transform:rotate(-5deg)}}
.fig-up{animation:breathe 4s ease-in-out infinite;transform-origin:120px 220px}
@keyframes breathe{50%{transform:translateY(-1.600px)}}
.bubble{position:absolute;inset-inline-end:clamp(8px,2.5vw,28px);top:clamp(8px,3vh,28px);width:min(56%,300px);background:var(--surface);color:var(--ink);padding:12px 14px;border-radius:16px;box-shadow:var(--shadow);pointer-events:auto;display:grid;gap:8px;font-size:clamp(13px,1.9vmin + 6px,16px);line-height:1.45;animation:rise .35s ease both}
.bub-a{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:6px 2px}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;min-height:38px}
.mini.solid,.bubble .mini{background:var(--accent);color:var(--accent-ink)}
.mini:disabled{opacity:.45;cursor:not-allowed}
.home-menu{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2.4vh,18px);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-width:0;overflow:auto;background:var(--bg)}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-mark{width:clamp(44px,12vmin,68px);flex:none}
.brand-mark .emblem{filter:none}
.brand-w{font-family:var(--fw);display:grid;line-height:1.1}
.brand-w b{font-size:clamp(15px,3.6vmin,23px);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand-w i{font-style:normal;font-size:clamp(9px,1.7vmin,11px);letter-spacing:.34em;color:var(--ink2)}
.tag{color:var(--ink2);font-size:clamp(13px,1.4vmin + 8px,17px);line-height:1.45;text-wrap:balance}
.tools{display:flex;gap:6px;align-items:center}
.tool{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--ink);flex:none}
.langs{display:flex;background:var(--surface2);border-radius:10px;padding:3px}
.langs button{padding:0 8px;height:32px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.langs .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.menu{display:grid;gap:8px;border-radius:18px}
.menu.spot{outline:3px solid var(--gold);outline-offset:4px}
.mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.mt{display:grid;text-align:start;min-width:0;line-height:1.3}
.mt b{font-size:clamp(15px,1.5vmin + 9px,19px)}
.mt i{font-style:normal;font-size:clamp(11px,.8vmin + 8px,14px);opacity:.82}
.m-main{display:flex;align-items:center;gap:12px;padding:clamp(9px,2vh,16px) 14px;border-radius:16px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);transition:transform .15s}
.m-main>.uic{margin-inline-start:auto}
.m-main:active,.m-sub:active,.primary:active{transform:scale(.98)}
.m-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-sub{display:flex;align-items:center;gap:10px;padding:clamp(8px,1.6vh,12px) 12px;border-radius:14px;background:var(--surface);color:var(--ink);min-width:0;box-shadow:0 2px 6px rgba(16,37,58,.08)}
.m-sub .mi{background:var(--surface2);width:34px;height:34px}
.how{align-self:flex-start}

/* หน้าฟอร์ม */
.form-scr{display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.bar h1{font-size:clamp(16px,2vmin + 10px,22px);font-weight:700}
html[dir="rtl"] .back .uic{transform:scaleX(-1)}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:8px max(14px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--surface);box-shadow:0 -4px 14px rgba(16,37,58,.08)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:10px 22px;border-radius:12px;font-weight:700;font-size:16px;min-height:44px}
.ghost{padding:10px 16px;border-radius:12px;font-weight:600;background:var(--surface2);min-height:44px}
.setup{flex:1;min-height:0;display:grid;grid-template-columns:clamp(170px,26vw,300px) minmax(0,1fr);gap:12px;padding:0 max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.pick-hero{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-height:0;background:var(--surface);border-radius:16px;padding:8px;overflow:hidden}
.arch{position:relative;min-height:0;border-radius:90px 90px 12px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--surface2)),color-mix(in srgb,var(--c) 58%,var(--surface2)));display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.arch .fig{position:relative;height:94%;width:auto;display:block;animation:figIn .42s cubic-bezier(.2,1.2,.4,1) both}
@keyframes figIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.pick-txt b{font-size:clamp(14px,1.6vmin + 8px,19px);display:block;margin-bottom:4px}
.pick-txt dl{margin:0;display:grid;gap:1px}
.pick-txt dl div{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.pick-txt dt{color:var(--ink2)}
.pick-txt dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.setup-main{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.row2{display:grid;grid-template-columns:1fr auto;gap:10px}
.field{display:grid;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
.field input{width:100%;background:var(--surface);color:var(--ink);border:1.500px solid var(--line);padding:9px 12px;border-radius:10px;font-size:16px;min-height:42px}
.seg{display:flex;background:var(--surface2);padding:3px;border-radius:11px;gap:2px}
.seg button{flex:1;padding:0 14px;min-height:36px;border-radius:9px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg .on{background:var(--accent);color:var(--accent-ink)}
.grid-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.grid-h h2{font-size:16px}
.grid-h small{color:var(--ink2);font-size:12px}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ccard{background:var(--surface);border-radius:14px;padding:6px;display:grid;gap:4px;border:2px solid transparent;transition:transform .15s}
.ccard.on{border-color:var(--accent)}
.cimg{position:relative;height:clamp(112px,23vh,170px);border-radius:46px 46px 9px 9px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,var(--surface2)),color-mix(in srgb,var(--c) 50%,var(--surface2)));display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.cimg .fig{position:relative;height:94%;width:auto}
.cn{font-size:12px;font-weight:600;line-height:1.25;min-height:2.5em;display:grid;place-items:center;text-align:center}
.narrow{flex:1;min-height:0;overflow:auto;width:100%;max-width:520px;margin:0 auto;padding:6px 14px;display:grid;gap:12px;align-content:start}
.note{color:var(--ink2);font-size:12.500px;line-height:1.5}
.codein{letter-spacing:.3em;text-transform:uppercase;font-weight:700}
.lobby{flex:1;min-height:0;display:grid;align-items:start;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:12px;padding:0 max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));overflow:auto}
.codebox{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:6px;align-content:start;justify-items:start}
.codebox span{font-size:13px;color:var(--ink2)}
.codebox b{font-size:clamp(24px,4vmin + 12px,38px);letter-spacing:.14em;color:var(--accent);font-family:var(--fw)}
.seats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start}
.seat{background:var(--surface);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.seat b{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat i{font-style:normal;font-size:10px;color:var(--ink2);margin-inline-start:auto}
.seat.empty{background:none;border:1.500px dashed var(--line);color:var(--ink2)}
.seat.empty b{font-weight:500}
.sb{width:38px;height:38px;border-radius:50%;display:block;overflow:hidden;flex:none;background:color-mix(in srgb,var(--c,#9db) 30%,var(--surface2));box-shadow:0 0 0 2px var(--c,var(--line))}
.bust{display:block;width:100%;height:100%}

/* ท่าทางตัวละคร: ทุกท่าเป็นมุมของไหล่และศอก เปลี่ยนคลาสแล้วแขนขยับไปเองอย่างลื่น */
.fig,.bust,.hero-fig{--ul:9deg;--fl:7deg;--ur:-9deg;--fr:-7deg;overflow:visible}
.ua,.fa,.prop,.fig-head,.fig-up,.fig-all{transition:transform .55s cubic-bezier(.3,1.45,.5,1)}
.ua-l{transform:rotate(var(--ul))}.fa-l{transform:rotate(var(--fl))}.ua-r{transform:rotate(var(--ur))}.fa-r{transform:rotate(var(--fr))}
.prop-r{transform:rotate(calc(-1*(var(--ur) + var(--fr))))}.prop-l{transform:rotate(calc(-1*(var(--ul) + var(--fl))))}
.fig-up{transform-origin:120px 250px}.fig-head{transform-origin:120px 124px}.fig-all{transform-origin:120px 350px}
.fig-up{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px)}}
.p-hold{--ul:-16deg;--fl:-74deg;--ur:16deg;--fr:74deg}
.p-holdR{--ur:14deg;--fr:92deg}
.p-raise{--ur:-128deg;--fr:-18deg}
.p-guide{--ul:-8deg;--fl:-84deg;--ur:-150deg;--fr:12deg}
.p-guide .fa-r{animation:greet 4.2s ease-in-out infinite}
@keyframes greet{0%,52%,100%{transform:rotate(10deg)}60%,76%{transform:rotate(-20deg)}68%,84%{transform:rotate(26deg)}}
.p-joy{--ul:152deg;--fl:-14deg;--ur:-152deg;--fr:14deg}
.p-joy .fig-all{animation:jump .62s cubic-bezier(.3,.6,.4,1) 3}
.p-joy .fig-up{animation:none}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-34px) scale(.97,1.03)}}
.p-win{--ur:-170deg;--fr:30deg}
.p-win .fig-all{animation:jump .7s cubic-bezier(.3,.6,.4,1) 2}
.p-dua{--ul:16deg;--fl:-166deg;--ur:-16deg;--fr:166deg}
.p-dua .fig-head{transform:translateY(4px)}
.p-think{--ul:-16deg;--fl:-62deg;--ur:30deg;--fr:128deg}
.p-think .fig-head{transform:rotate(-6deg)}
.p-point{--ur:-74deg;--fr:-10deg}
.p-point .fig-up{animation:lean 1.4s ease-in-out infinite}
@keyframes lean{50%{transform:rotate(3deg)}}
.p-shock{--ul:64deg;--fl:-126deg;--ur:-64deg;--fr:126deg}
.p-shock .fig-all{animation:shake .4s linear 3}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.p-slump{--ul:4deg;--fl:2deg;--ur:-4deg;--fr:-2deg}
.p-slump .fig-head{transform:translateY(14px) rotate(5deg)}
.p-slump .fig-up{animation:none;transform:translateY(8px) rotate(2deg) scaleY(.97)}
.p-hug{--ul:-30deg;--fl:-100deg;--ur:30deg;--fr:100deg}
/* ฉากอนาคต */
.vista,.life{display:block;width:100%;height:100%}
.v-rays{animation:spin 80s linear infinite}
.v-sun{animation:sunrise 1.6s cubic-bezier(.2,.8,.3,1) both}
@keyframes sunrise{from{transform:translateY(70px);opacity:.3}}
.v-tw{animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.v-c1{animation:drift 26s ease-in-out infinite alternate}.v-c2{animation:drift 34s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translateX(46px)}}
.v-spark{animation:sparkup 5s linear infinite;opacity:0}
@keyframes sparkup{10%{opacity:1}80%{opacity:.8}100%{transform:translateY(-210px);opacity:0}}
.v-win{animation:winon .6s steps(2) both,tw 7s ease-in-out infinite 2s}
@keyframes winon{from{opacity:0}}
.v-land{animation:landin 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes landin{from{transform:translateY(26px);opacity:0}}
.v-swing{animation:swing 4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.v-pulse{animation:vpulse 1.6s ease-in-out infinite}
@keyframes vpulse{50%{transform:scale(1.14)}}
.v-ecg{stroke-dasharray:100;animation:ecg 3.4s linear infinite}
.v-ecg.once{animation:ecg 2.4s ease-out both}
@keyframes ecg{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.v-up{animation:vup 5s ease-in infinite;opacity:0}
@keyframes vup{15%{opacity:1}100%{translate:0 -90px;opacity:0}}
.v-float{animation:vfloat 4s ease-in-out infinite}
@keyframes vfloat{50%{transform:translateY(-9px)}}
.v-sway{animation:vsway 3.4s ease-in-out infinite}
@keyframes vsway{0%,100%{transform:rotate(-2.500deg)}50%{transform:rotate(2.500deg)}}
.v-beam{animation:vbeam 6s ease-in-out infinite}.v-beam.b2{animation-delay:-3s}
@keyframes vbeam{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
.v-screen{animation:vscreen 3.5s ease-in-out infinite}
@keyframes vscreen{50%{transform:translateY(-10px)}}
.v-blink{animation:tw 1.2s steps(2) infinite}
.v-bob{animation:vbob 3.6s ease-in-out infinite}
@keyframes vbob{50%{transform:translateY(-6px) rotate(1deg)}}
.v-wave{animation:vwave 5s linear infinite}.v-wave.w2{animation-duration:8s}
@keyframes vwave{to{transform:translateX(-80px)}}
.v-spin{animation:spin 18s linear infinite}

const Life={
 make(name,c,g,i,bot,skin,dream){const p={name,c,g,bot,skin,seat:i,color:SEAT_COLORS[i],cash:c.cash,income:c.income,passive:0,exp:c.exp,riba:c.riba,ribaM:c.ribaM,
   d:{iman:42,family:38,health:60,ilm:32,ummah:28,mal:0},stress:c.stress,age:START_AGE,spouse:false,kids:[],assets:[],ring:'in',pos:0,dream,dreamDone:false,story:[],trust:0,focus:null,prev:null,flags:{},insured:false,home:false,dm:null,saved:0,echoes:[],names:{spouse:'',kid:'',friend:''},prov:null};
  p.d.mal=this.mal(p);return p;},
 worth(p){return p.cash+p.assets.reduce((a,x)=>a+x.cost,0)-p.riba;},

 focus(p,k){p.focus=k;if(k==='mal'){p.cash+=Math.round(p.income*5);p.stress=clamp(p.stress+10);}else{p.d[k]=clamp(p.d[k]+14);if(k==='health'||k==='iman')p.stress=clamp(p.stress-10);else if(k==='family')p.stress=clamp(p.stress-5);}},
 /* ผลของตัวเลือก: คืนรายการเปลี่ยนแปลงเพื่อแสดงผล */
 preview(p,fx){const out=[];let m=fx.mo?Math.round(fx.mo*p.income/500)*500:0;if(fx.ins&&p.insured&&m<0)m=Math.round(m/2);let cash=m;
  if(fx.zakat)cash-=Math.round(Math.max(0,p.cash)*.025);if(fx.cash)cash+=fx.cash;if(fx.give)cash-=Math.round(p.income*fx.give*.5/500)*500;if(fx.save)cash-=this.saveAmt(p);
  if(cash)out.push(['cash',cash]);DIM_IDS.forEach(k=>{if(fx[k])out.push([k,fx[k]]);});if(fx.stress)out.push(['stress',fx.stress]);
  if(fx.passive)out.push(['passive',Math.round(fx.passive*(fx.passive<1?p.exp:1))]);if(fx.exp)out.push(['exp',fx.exp]);if(fx.expMo)out.push(['exp',Math.round(fx.expMo*p.income)]);if(fx.ribaMo)out.push(['exp',Math.round(fx.ribaMo*p.income/60)]);return out;},
 saveAmt(p){return Math.round(Math.min(Math.max(0,p.cash)*.3,this.dreamCost(p)/4)/1000)*1000;},
 apply(p,fx){this.preview(p,fx).forEach(([k,v])=>{if(k==='cash')p.cash+=v;else if(k==='stress')p.stress=clamp(p.stress+v);else if(k==='passive')p.passive+=v;else if(k==='exp')p.exp+=v;else if(k!=='mal')p.d[k]=clamp(p.d[k]+v);});
  if(fx.spouse)p.spouse=true;if(fx.kid){p.kids.push(p.age);p.exp+=2500;}if(fx.flag)p.flags[fx.flag]=(p.flags[fx.flag]||0)+1;if(fx.flag==='insured')p.insured=true;if(fx.home)p.home=true;if(fx.save)p.saved+=this.saveAmt(p)||0;
  if(fx.riba){p.riba+=fx.riba;p.ribaM+=Math.round(fx.riba/60);p.exp+=Math.round(fx.riba/60);}if(fx.ribaMo){const a=fx.ribaMo*p.income;p.riba+=a;p.ribaM+=Math.round(a/60);p.exp+=Math.round(a/60);}
  if(fx.dm){const st=Math.round(.1*p.income/5);p.dm={left:5,step:st};}

  p.d.mal=this.mal(p);},

  p.assets.forEach(a=>{const r=Math.random();if(!swing&&a.income){if(r<.16){const v=Math.round(a.income*18);net-=v;swing={a,v:-v};}else if(r<.3){const v=Math.round(a.income*12);net+=v;swing={a,v};}}});
  p.cash+=net;p.age+=STEP;if(p.dm&&p.dm.left>0){p.exp-=p.dm.step;p.dm.left--;}
  DIM_IDS.forEach(k=>{if(k==='mal'||k===p.focus)return;const loss=k==='family'?(p.kids.length?10:8):k==='health'?(p.age>45?10:7):k==='iman'?7:7;p.d[k]=clamp(p.d[k]-loss);});

const FX={cv:null,parts:[],raf:0,
 init(){if(this.cv&&this.cv.isConnected)return this.cv;const c=document.createElement('canvas');c.id='fx';$('#app').appendChild(c);this.cv=c;return c;},
 burst(kind){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=this.init(),w=c.width=innerWidth,h=c.height=innerHeight;const cols={win:['#FFB52E','#FFE28A','#10B981','#3B82F6','#EC4899'],joy:['#F0568C','#FF9EC4','#FFE28A'],opp:['#7EE0FF','#FFF','#3B82F6'],dua:['#FFF3C4','#FFE28A','#FFF'],fail:['#9DB3CC','#7E93AE'],sad:['#C7B5A0','#A08B74']}[kind]||['#fff'];
  const N={win:110,joy:46,opp:34,dua:44,fail:90,sad:22}[kind]||30;
  for(let i=0;i<N;i++){const P={c:cols[i%cols.length],k:kind,life:0,max:90+Math.random()*80,r:2+Math.random()*4,a:Math.random()*6.28,s:(Math.random()-.5)*.3};
   if(kind==='win'){P.x=w/2;P.y=h*.55;const a=Math.random()*6.28,v=5+Math.random()*9;P.vx=Math.cos(a)*v;P.vy=Math.sin(a)*v-5;P.g=.2;}
   else if(kind==='fail'){P.x=Math.random()*w*1.2;P.y=-Math.random()*h;P.vx=-3;P.vy=13+Math.random()*7;P.g=0;P.line=1;}
   else if(kind==='sad'){P.x=Math.random()*w;P.y=-20-Math.random()*h*.5;P.vx=Math.random()*1.2-.2;P.vy=1+Math.random();P.g=0;P.max=220;}
   else{P.x=w*.2+Math.random()*w*.6;P.y=h+Math.random()*60;P.vx=Math.random()*1.6-.8;P.vy=-(2.4+Math.random()*3);P.g=0;P.max=130+Math.random()*60;P.heart=kind==='joy';}
   this.parts.push(P);}
  if(!this.raf)this.tick();},
 tick(){const c=this.cv;if(!c||!c.isConnected){this.parts=[];this.raf=0;return;}const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  this.parts=this.parts.filter(p=>p.life<p.max);this.parts.forEach(p=>{p.life++;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.a+=p.s;const o=Math.min(1,(p.max-p.life)/30);x.globalAlpha=o;x.fillStyle=p.c;x.strokeStyle=p.c;
   if(p.line){x.lineWidth=1.6;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+2,p.y-14);x.stroke();}
   else if(p.heart){const r=p.r+2;x.beginPath();x.moveTo(p.x,p.y+r);x.bezierCurveTo(p.x-r*2,p.y-r*.4,p.x-r,p.y-r*1.6,p.x,p.y-r*.5);x.bezierCurveTo(p.x+r,p.y-r*1.6,p.x+r*2,p.y-r*.4,p.x,p.y+r);x.fill();}
   else{x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);x.restore();}});
  x.globalAlpha=1;if(this.parts.length)this.raf=requestAnimationFrame(()=>this.tick());else{this.raf=0;x.clearRect(0,0,c.width,c.height);}}};

 crisis(){const s=this.s,me=this.me();s.ev=this.fromEv('crisis','qadar',me);s.ev.opts.forEach((o,i)=>{const fx=EV.crisis.o[i];o.run=q=>{Life.apply(q,fx);const g=fx.give;const unit=p=>Math.round(p.income*.5);let got=g*unit(q),goal=0;s.p.forEach(x=>{goal+=unit(x)*1.4;if(x.bot){const b=rnd([0,1,1,2])+(x.trust?1:0);x.cash-=b*unit(x);got+=b*unit(x);}});const ok=got>=goal;s.p.forEach(x=>{if(ok){x.d.ummah=clamp(x.d.ummah+10);}else{x.cash-=x.income*1.5;x.stress=clamp(x.stress+10);x.d.ummah=clamp(x.d.ummah-4);}});this.chatSys(ok?t().crisisDone:t().crisisFail);o.chips=[...(o.chips||[]),['ummah',ok?10:-4]];};});s.cont=()=>{s.phase='wait';this.refresh();this.begin();};s.phase='event';this.refresh();this.moment(s.ev);},

/* ---------- การกดทั้งหมด ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-lang],[data-go],[data-opt],[data-g],[data-career],[data-dream],[data-seats],[data-priv],[data-card],[data-dim],[data-view],[data-q],[data-act],[data-tile]');if(!b)return;const d=b.dataset;

 if(d.career){saveFields();App.me.career=d.career;store.set('career',d.career);const sc=$('.cgrid')?.scrollTop;render();const g=$('.cgrid');if(g)g.scrollTop=sc||0;return;}
 if(d.dream){const x=DREAMS[+d.dream];App.me.dream=x;document.querySelectorAll('.dcard').forEach(n=>n.classList.toggle('on',n===b));$('#dr-bg').innerHTML=Art.dreamArt(x.i);$('#dr-info').innerHTML=dreamInfo(x);return;}
 if(d.seats){saveFields();App.room.seats=+d.seats;return render();}
 if(d.priv){saveFields();App.room.priv=+d.priv;return render();}
 if(d.opt!==undefined)return Game.choose(+d.opt);
 if(d.card!==undefined)return Game.pickCard(+d.card);
 if(d.dim){if(d.idle){const k=d.dim,tp=$('#stage');if(tp)tp.innerHTML=`<p class="dim-t">${t().dims[k]} ${Game.s.p[Game.s.view].d[k]}</p>`;return;}return Game.pickFocus(d.dim);}
 if(d.view!==undefined){Game.s.view=+d.view;return Game.refresh({life:1});}
 if(d.q!==undefined)return Game.send(t().quick[+d.q]);
 if(d.pick!==undefined&&Game.s&&Game.s.phase==='cards')return Game.pickCard(+d.pick);
 if(d.tile){const n=$('#tip');if(n)n.textContent=t().tiles[d.tile];return;}
 switch(d.act){
  case 'enter':Sound.play();App.tour=store.get('homeTour',false)?null:0;go('home');break;
  case 'theme':saveFields();toggleTheme();break;
  case 'sound':saveFields();Sound.toggle();break;
  case 'tour-next':App.tour=App.tour>=2?null:App.tour+1;if(App.tour===null)store.set('homeTour',true);render();break;
  case 'tour-skip':App.tour=null;store.set('homeTour',true);render();break;
  case 'tour-start':App.tour=0;render();break;
  case 'start':Game.start();break;
  case 'make-room':saveFields();App.room.code='';App.room.bots=0;go('lobby');break;
  case 'add-bot':if(App.room.bots<App.room.seats-1){App.room.bots++;render();}break;
  case 'copy':{const u=location.href.split('#')[0]+'#room-'+App.room.code,l=$('#copy-l');const done=()=>{if(l)l.textContent=t().copied;};try{navigator.clipboard.writeText(u).then(done,done);}catch(x){done();}break;}
  case 'join-room':go('home');break;
  case 'quit':Game.quit();break;
  case 'next':Game.afterEvent();break;
  case 'skip':$('#moment')?.classList.add('open');break;
  case 'share':Game.shareCard();break;
  case 'restore':{const v=$('#f-device').value.trim(),m=$('#prof-msg');if(!/^[0-9a-f-]{36}$/i.test(v)){m.textContent=t().codeBad;break;}Net.rpc('mfl_my',{p_device:v}).then(r=>{if(!r||!r.games){m.textContent=t().codeNone;return;}Profile.d.device=v;Profile.d.games=Math.max(Profile.d.games,r.games);Profile.d.best=Math.max(Profile.d.best,r.best);Profile.save();if(r.name){App.me.name=r.name;store.set('name',r.name);}render();}).catch(()=>{m.textContent=t().netOff;});break;}
  case 'forget':{const m=$('#prof-msg');if(!confirm(t().forgetQ))break;Net.rpc('mfl_forget',{p_device:Profile.d.device}).then(()=>{Profile.d={device:newDevice(),games:0,best:0,lives:[],tips:{}};Profile.save();render();}).catch(()=>{m.textContent=t().netOff;});break;}
  case 'reroll':{const n=$('#or-name');let i=0;const iv=setInterval(()=>{n.textContent=provName(PROVINCES[Math.floor(Math.random()*PROVINCES.length)]);if(++i>12){clearInterval(iv);const x=rollProvince();App.me.prov=x;n.textContent=provName(x);$('#or-reg').textContent=regionName(x);$('#or-bg').innerHTML=Art.vista(REGION[x.r].art,1);}},70);break;}
  case 'chat':Game.toggleChat();break;
  case 'mic':Game.chatSys(t().micNote);if(!Game.chatOpen)Game.toggleChat();break;
  case 'again':Game.s=null;go('setup');break;
  case 'to-home':Game.s=null;go('home');break;
 }
});
document.addEventListener('submit',e=>{if(e.target.id==='chatf'){e.preventDefault();Game.send($('#chat-in').value);}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(App.screen==='gate'||h===App.screen)return;if(Screens[h]&&!['game','gate','end','origin'].includes(h)){if(h==='lobby'&&!App.room.code)return;App.screen=h;Sound.duck(false);Game.clear();render();}});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(App.screen!=='game')render();});
document.documentElement.style.setProperty('--tile-pattern',Art.pattern);
applyLang();render();Net.flush().catch(()=>{});
